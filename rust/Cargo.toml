[package]
name = "everything-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "everything-helper"
path = "src/main.rs"

[dependencies]
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v5"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
